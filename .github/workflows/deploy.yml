name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Set worker name to andromedaplay
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.output/server/wrangler.json', 'utf8'));
          config.name = 'andromedaplay';
          fs.writeFileSync('.output/server/wrangler.json', JSON.stringify(config, null, 2));
          console.log('wrangler.json updated:', JSON.stringify(config, null, 2));
          "

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 555b4a54dec3d097c90bc3826983a20a
          workingDirectory: .output/server
          wranglerVersion: '3'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
